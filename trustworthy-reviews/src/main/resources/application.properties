spring.application.name=trustworthy-reviews

# In-memory H2 database (swap for Azure SQL / PostgreSQL later via environment variables)
spring.datasource.url=jdbc:h2:mem:reviewsdb
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create/update tables from @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console at http://localhost:8080/h2-console (handy for checking tables and the DB diagram)
spring.h2.console.enabled=true

# Azure App Service supplies PORT; default to 8080 locally
server.port=${PORT:8080}
